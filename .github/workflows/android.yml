name: Android build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "把 APK 附加到这个 release 标签；留空则只上传构建产物"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --console=plain

      - name: Assemble debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleDebug --console=plain

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            NAME="scp-archive-${VERSION}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$NAME"
          else
            NAME="scp-archive-${VERSION}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
